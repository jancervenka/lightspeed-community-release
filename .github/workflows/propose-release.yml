name: Propose community operator release

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: "New community operator version (for example, 0.0.3)"
        required: true
        type: string
      container_image_tag:
        description: "Tag used for both the operator-bundle and operator images"
        required: true
        default: latest
        type: string
      fork_repository:
        description: "Existing fork to push to, in owner/repository form"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: community-release-${{ inputs.fork_repository }}-${{ inputs.new_version }}
  cancel-in-progress: false

jobs:
  propose-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      NEW_VERSION: ${{ inputs.new_version }}
      CONTAINER_IMAGE_TAG: ${{ inputs.container_image_tag }}
      FORK_REPOSITORY: ${{ inputs.fork_repository }}
      AUTHOR_NAME: ${{ vars.RELEASE_AUTHOR_NAME }}
      AUTHOR_EMAIL: ${{ vars.RELEASE_AUTHOR_EMAIL }}

    steps:
      - name: Check out community operators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: redhat-openshift-ecosystem/community-operators-prod
          ref: main
          path: community-operators-prod
          # Keep history for pushing to forks that are behind upstream.
          fetch-depth: 0
          sparse-checkout: operators/openstack-lightspeed-operator
          persist-credentials: false

      - name: Prepare community bundle
        id: bundle
        working-directory: community-operators-prod
        env:
          # The preparation script only needs to know whether the PAT is configured.
          HAS_TOKEN: ${{ secrets.COMMUNITY_OPERATORS_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_TOKEN" != true ]]; then
            echo "::error::Set the COMMUNITY_OPERATORS_TOKEN repository secret."
            exit 1
          fi
          : "${AUTHOR_NAME:?Set the RELEASE_AUTHOR_NAME repository variable.}"
          : "${AUTHOR_EMAIL:?Set the RELEASE_AUTHOR_EMAIL repository variable.}"
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$NEW_VERSION" =~ $version_pattern ]]; then
            echo "::error::new_version must have the form X.Y.Z."
            exit 1
          fi
          if [[ ! "$FORK_REPOSITORY" =~ ^[a-zA-Z0-9-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::fork_repository must have the form owner/repository."
            exit 1
          fi
          if [[ ! "$CONTAINER_IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::container_image_tag must be a valid container image tag."
            exit 1
          fi

          operator_dir=operators/openstack-lightspeed-operator
          release_dir="$operator_dir/$NEW_VERSION"
          if [[ -e "$release_dir" ]]; then
            echo "::error::Version $NEW_VERSION already exists on upstream main."
            exit 1
          fi
          PREVIOUS_VERSION=$(
            { find "$operator_dir" -mindepth 1 -maxdepth 1 -type d -printf '%f\n'; printf '%s\n' "$NEW_VERSION"; } |
              grep -E "$version_pattern" | sort -Vu |
              awk -v version="$NEW_VERSION" '$0 == version { print previous } { previous = $0 }'
          )
          : "${PREVIOUS_VERSION:?No existing community release precedes this version.}"

          OPERATOR_IMAGE_DIGEST=$(curl --fail --silent --show-error --max-time 30 \
            --get --data-urlencode "specificTag=$CONTAINER_IMAGE_TAG" \
            --data-urlencode 'onlyActiveTags=true' \
            https://quay.io/api/v1/repository/openstack-lightspeed/operator/tag/ |
            jq -r --arg tag "$CONTAINER_IMAGE_TAG" \
              '[.tags[]? | select(.name == $tag) | .manifest_digest][0] // empty')
          if [[ ! "$OPERATOR_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No active operator image with a valid digest for $CONTAINER_IMAGE_TAG."
            exit 1
          fi
          export PREVIOUS_VERSION OPERATOR_IMAGE_DIGEST

          image="quay.io/openstack-lightspeed/operator-bundle:$CONTAINER_IMAGE_TAG"
          podman pull "$image"
          image_id=$(podman image inspect --format '{{.Id}}' "$image")
          # Podman 4 requires a command even though this container is never started.
          container_id=$(podman create "$image_id" /bin/true)
          trap 'podman rm "$container_id" >/dev/null || true' EXIT
          mkdir -p "$release_dir"
          for directory in manifests metadata tests; do
            podman cp "$container_id:/$directory" "$release_dir/$directory"
          done

          yq -i '
            .metadata.name = ("openstack-lightspeed-operator.v" + strenv(NEW_VERSION)) |
            .metadata.annotations.containerImage = ("quay.io/openstack-lightspeed/operator@" + strenv(OPERATOR_IMAGE_DIGEST)) |
            .metadata.annotations.support = "Community" |
            .spec.displayName = "OpenStack Lightspeed (Community)" |
            .spec.replaces = ("openstack-lightspeed-operator.v" + strenv(PREVIOUS_VERSION)) |
            .spec.version = strenv(NEW_VERSION)
          ' "$release_dir/manifests/openstack-lightspeed-operator.clusterserviceversion.yaml"

          cat > "$release_dir/release-config.yaml" <<EOF
          catalog_templates:
            - template_name: v4.16.yaml
              channels: [alpha]
              replaces: openstack-lightspeed-operator.v$PREVIOUS_VERSION
            - template_name: v4.18.yaml
              channels: [alpha]
              replaces: openstack-lightspeed-operator.v$PREVIOUS_VERSION
          EOF
          echo "operator_digest=$OPERATOR_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Create or update upstream pull request
        id: pr
        working-directory: community-operators-prod
        env:
          GH_TOKEN: ${{ secrets.COMMUNITY_OPERATORS_TOKEN }}
          GH_PROMPT_DISABLED: "1"
          GIT_TERMINAL_PROMPT: "0"
          OPERATOR_DIGEST: ${{ steps.bundle.outputs.operator_digest }}
        run: |
          set -euo pipefail
          upstream=redhat-openshift-ecosystem/community-operators-prod
          branch="openstack-lightspeed-release-$NEW_VERSION"
          title="operator openstack-lightspeed-operator ($NEW_VERSION)"
          head="${FORK_REPOSITORY%%/*}:$branch"

          gh auth setup-git --hostname github.com
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git remote add fork "https://github.com/$FORK_REPOSITORY.git"
          remote_head=$(git ls-remote fork "refs/heads/$branch" | cut -f1)
          git switch -c "$branch"
          git add -- "operators/openstack-lightspeed-operator/$NEW_VERSION"
          git commit --signoff -m "$title"
          # Only replace the branch if it has not changed since we read it.
          git push --force-with-lease="refs/heads/$branch:$remote_head" \
            fork "HEAD:refs/heads/$branch"

          body_file="$RUNNER_TEMP/community-release-pr.md"
          cat > "$body_file" <<EOF
          Release OpenStack Lightspeed community operator $NEW_VERSION.

          - Bundle image: quay.io/openstack-lightspeed/operator-bundle:$CONTAINER_IMAGE_TAG
          - Operator image: quay.io/openstack-lightspeed/operator@$OPERATOR_DIGEST

          Generated by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).
          EOF

          # REST calls through gh support both personal and organization forks.
          pr_number=$(gh api --method GET "repos/$upstream/pulls" \
            -f state=open -f base=main -f "head=$head" --jq '.[0].number // empty')
          if [[ -n "$pr_number" ]]; then
            pr_url=$(gh api --method PATCH "repos/$upstream/pulls/$pr_number" \
              -f "title=$title" -F "body=@$body_file" --jq .html_url)
          else
            pr_url=$(gh api --method POST "repos/$upstream/pulls" \
              -f base=main -f "head=$head" -f "head_repo=${FORK_REPOSITORY#*/}" \
              -f "title=$title" -F "body=@$body_file" --jq .html_url)
          fi
          echo "pull-request-url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Show pull request
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          printf 'Release pull request: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
